<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nerdearla — Subtítulos en vivo</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/estilo.css">
</head>
<body class="pagina-indice">
<header class="cabecera-indice">
  <div class="marca-indice">
    <h1>Nerdearla — Subtítulos en vivo</h1>
    <p class="ayuda">Elegí una sesión y un idioma. Sin login, sin app.</p>
    <p id="aviso-hub-ignorado" class="aviso-hub-ignorado" hidden>Se ignoró un hub externo en el enlace (?hub=): sólo se admite localhost o este mismo host.</p>
  </div>
  <p class="indicacion-qr">Escaneá el QR de tu sala</p>
</header>
<main id="lista-sesiones" class="lista-sesiones">
  <p class="estado-carga">Buscando sesiones…</p>
</main>
<!-- B9 (R6, "del QR al texto en 2 toques"): qrcode-generator v1.4.4 (MIT, Kazuhiko Arase),
     vendorizado sin CDN en /vendor/, ver web/README.md. -->
<script src="/vendor/qrcode-generator/qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);

  // B10 (seguridad, aviso del orquestador): mismo chequeo que app.js — ?hub= sólo admite
  // localhost/127.0.0.1/[::1]/el propio location.hostname, para que un enlace armado por un
  // tercero no pueda hacer que esta página le pida la lista de sesiones a un host arbitrario.
  // Arreglo M1 (adversario-final-seguridad): ver el mismo comentario en app.js. "localhost:8100@evil.example"
  // pasaba antes porque el parser tomaba "lo que está antes de los dos puntos" como host; en la URL
  // real armada (ws://localhost:8100@evil.example/...) eso es USERINFO, y el host real es evil.example.
  function hubHostPermitido(hostPuerto) {
    if (typeof hostPuerto !== 'string' || hostPuerto === '') return false;
    if (/[@/\\?#]/.test(hostPuerto)) return false;
    var url;
    try {
      url = new URL('http://' + hostPuerto);
    } catch (e) {
      return false;
    }
    if (url.username || url.password) return false;
    var host = url.hostname.toLowerCase();
    return host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '[::1]' ||
      host === location.hostname.toLowerCase();
  }
  var hubParamCrudo = params.get('hub');
  var hubParam = null;
  if (hubParamCrudo) {
    if (hubHostPermitido(hubParamCrudo)) {
      hubParam = hubParamCrudo;
    } else {
      console.warn('[seguridad] ?hub= ignorado (host no permitido):', hubParamCrudo);
      var avisoHub = document.getElementById('aviso-hub-ignorado');
      if (avisoHub) avisoHub.hidden = false;
    }
  }
  // B4: mismo origen si esta pagina la sirve el propio hub (hub/estaticos.py); si la sirve
  // web/servir.py (puerto de dev 8101) el hub de dev sigue en :8100. Mismo criterio que app.js
  // (ver su comentario "calcularOrigen"): el puerto es la unica señal confiable del lado cliente.
  var PUERTO_DEV_WEB = '8101';
  var mismoOrigen = !hubParam && location.protocol !== 'file:' && location.port !== PUERTO_DEV_WEB;
  var httpScheme = (mismoOrigen && location.protocol === 'https:') ? 'https' : 'http';
  var hubHost = hubParam || (mismoOrigen ? location.host : (location.hostname + ':8100'));
  var apiUrl = httpScheme + '://' + hubHost + '/api/sesiones';
  var cont = document.getElementById('lista-sesiones');

  function nombreEstado(s) {
    if (s === 'live') return 'en vivo';
    if (s === 'idle') return 'en espera';
    if (s === 'ended') return 'finalizada';
    return s || 'desconocido';
  }

  function linksIdioma(s) {
    var idiomas = [s.lang];
    // B2: el hub manda translations_langs; si todavía corre el hub viejo (sin este campo)
    // caemos al supuesto anterior (es<->en) para no dejar el índice sin el link de traducción.
    var extra = Array.isArray(s.translations_langs) ? s.translations_langs
      : (s.lang === 'en' ? ['es'] : (s.lang === 'es' ? ['en'] : []));
    extra.forEach(function (xx) {
      if (idiomas.indexOf(xx) === -1) idiomas.push(xx);
    });
    return idiomas.map(function (xx) {
      var qs = new URLSearchParams();
      qs.set('lang', xx);
      if (hubParam) qs.set('hub', hubParam);
      var a = document.createElement('a');
      a.href = '/s/' + encodeURIComponent(s.session_id) + '?' + qs.toString();
      a.className = 'link-idioma';
      a.textContent = xx === s.lang ? (xx + ' (original)') : xx;
      return a;
    });
  }

  // B9: URL ABSOLUTA de la vista en el idioma ORIGINAL de la sesión (no la del idioma que el
  // visitante esté mirando en el índice): es lo que codifica el QR, para que cualquier telefono
  // que lo escanee llegue directo a `/s/<id>?lang=<original>` sin depender de que este documento
  // siga abierto. `location.origin` es correcto en los dos modos de servido (mismo origen del hub,
  // o web/servir.py en 8101: en ambos casos ESTE documento y `/s/<id>` viven en el mismo origen;
  // sólo la conexión AL HUB de datos cambia, resuelto aparte por app.js, ver su comentario
  // "calcularOrigen"). Preserva `?hub=` si el índice lo tenía (dev contra un hub que no es el de
  // este origen).
  function urlAbsolutaOriginal(s) {
    var qs = new URLSearchParams();
    qs.set('lang', s.lang);
    if (hubParam) qs.set('hub', hubParam);
    return location.origin + '/s/' + encodeURIComponent(s.session_id) + '?' + qs.toString();
  }

  // B9: SVG del QR (sin CDN, ver /vendor/qrcode-generator/). `null` si la librería no cargó
  // (defensivo: si algún día falla la vendorización, el índice sigue funcionando sólo con el
  // botón "copiar enlace", que es la degradación explícita que pide el brief).
  function generarQrSvg(url) {
    if (typeof window.qrcode !== 'function') return null;
    try {
      var qr = window.qrcode(0, 'M'); // typeNumber 0 = auto (ajusta al largo de la URL); ECC 'M'
      qr.addData(url);
      qr.make();
      return qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true, alt: 'Código QR', title: url });
    } catch (e) {
      console.error('[qr] no se pudo generar el QR para', url, e);
      return null;
    }
  }

  // B9: "copiar enlace". Clipboard API exige contexto seguro (https o localhost); en un evento
  // real el índice se sirve por http plano en la LAN del lugar, así que hace falta el fallback de
  // toda la vida (textarea + execCommand) para que el botón funcione también ahí.
  function copiarFallback(url) {
    try {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, url.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copiarEnlace(url, btn, estadoEl) {
    function marcarCopiado(ok) {
      if (!ok) { window.prompt('Copiá el enlace:', url); return; }
      var original = btn.textContent;
      estadoEl.hidden = false;
      btn.textContent = 'Copiado';
      setTimeout(function () { btn.textContent = original; estadoEl.hidden = true; }, 1500);
    }
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { marcarCopiado(true); },
        function () { marcarCopiado(copiarFallback(url)); });
    } else {
      marcarCopiado(copiarFallback(url));
    }
  }

  // Sesiones de prueba (test:true, del transporte de casete o ejemplos del contrato) se ocultan
  // salvo que la URL traiga ?test=1. Agregado por el orquestador al cierre de B4.
  var mostrarTest = new URLSearchParams(location.search).get('test') === '1';

  // sistema.md §1/§2 (ref. "Security Operations Dashboard"): jerarquía por URGENCIA, no
  // alfabética/orden de llegada — una sesión en vivo importa más que una finalizada.
  var PRIORIDAD_ESTADO = { live: 0, idle: 1, ended: 2 };
  function prioridad(s) {
    var p = PRIORIDAD_ESTADO[s.state];
    return (typeof p === 'number') ? p : 3;
  }

  function render(sesiones) {
    if (!mostrarTest && sesiones) {
      sesiones = sesiones.filter(function (s) { return !s.test; });
    }
    if (sesiones) {
      sesiones = sesiones.slice().sort(function (a, b) { return prioridad(a) - prioridad(b); });
    }
    cont.textContent = '';
    if (!sesiones || sesiones.length === 0) {
      var vacio = document.createElement('p');
      vacio.className = 'estado-carga';
      vacio.textContent = 'No hay sesiones activas todavía.';
      cont.appendChild(vacio);
      return;
    }
    sesiones.forEach(function (s) {
      var tarjeta = document.createElement('article');
      tarjeta.className = 'tarjeta-sesion';
      // Franja de color en el borde izquierdo por estado (sistema.md §2 ref. "Master Control
      // Room"): un acento, no la tarjeta entera pintada. El REPLAY manda sobre el estado (ya es
      // lo más saliente del badge de arriba).
      tarjeta.classList.add('tarjeta-sesion--' + (s.replay ? 'replay' : (s.state || 'desconocido')));

      var h2 = document.createElement('h2');
      h2.textContent = s.title || s.session_id;
      tarjeta.appendChild(h2);

      var meta = document.createElement('p');
      meta.className = 'meta-sesion';
      var badge = document.createElement('span');
      badge.className = 'badge badge--' + (s.state || 'desconocido');
      badge.textContent = nombreEstado(s.state);
      meta.appendChild(badge);
      if (s.replay) {
        var badgeReplay = document.createElement('span');
        badgeReplay.className = 'badge badge--replay';
        badgeReplay.textContent = 'REPLAY';
        meta.appendChild(badgeReplay);
      }
      tarjeta.appendChild(meta);

      var idLinea = document.createElement('p');
      idLinea.className = 'id-sesion';
      idLinea.textContent = 'id: ' + s.session_id;
      tarjeta.appendChild(idLinea);

      var nav = document.createElement('nav');
      nav.className = 'links-idioma';
      linksIdioma(s).forEach(function (a) { nav.appendChild(a); });
      tarjeta.appendChild(nav);

      // B9 (R6, "del QR al texto en 2 toques"): QR a la vista en el idioma ORIGINAL + botón
      // "copiar enlace". Toque 1 = escanear con la cámara; toque 2 = abrir el link que ofrece el
      // propio sistema operativo al reconocer el QR.
      var urlQr = urlAbsolutaOriginal(s);
      var qrWrap = document.createElement('div');
      qrWrap.className = 'qr-sesion';

      var svg = generarQrSvg(urlQr);
      if (svg) {
        var qrLink = document.createElement('a');
        qrLink.className = 'qr-link';
        qrLink.href = urlQr;
        qrLink.setAttribute('aria-label', 'Abrir la sesión ' + s.session_id + ' en ' + s.lang + ' (idioma original)');
        qrLink.innerHTML = svg;
        qrWrap.appendChild(qrLink);
      }

      var qrAcciones = document.createElement('div');
      qrAcciones.className = 'qr-acciones';
      var btnCopiar = document.createElement('button');
      btnCopiar.type = 'button';
      btnCopiar.className = 'boton-copiar';
      btnCopiar.textContent = 'Copiar enlace';
      var estadoCopiado = document.createElement('span');
      estadoCopiado.className = 'copiado-ok';
      estadoCopiado.textContent = 'Copiado';
      estadoCopiado.hidden = true;
      btnCopiar.addEventListener('click', function () {
        copiarEnlace(urlQr, btnCopiar, estadoCopiado);
      });
      qrAcciones.appendChild(btnCopiar);
      qrAcciones.appendChild(estadoCopiado);
      qrWrap.appendChild(qrAcciones);

      tarjeta.appendChild(qrWrap);

      cont.appendChild(tarjeta);
    });
  }

  // M3+M4 (adversario-final-ux): antes se rehacía TODO el DOM cada 5s aunque nada hubiera
  // cambiado (perdía el foco de teclado, cortaba el "Copiado", regeneraba los QR) y un error
  // aislado borraba toda la lista + mostraba la URL y "Failed to fetch" en inglés.
  var ultimoJsonTexto = null; // string crudo de la última respuesta que SÍ se pintó
  var seCargoAlgunaVez = false;
  function cargar() {
    fetch(apiUrl).then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.text();
    }).then(function (texto) {
      if (texto === ultimoJsonTexto) return; // sin cambios: no se rehace el DOM (conserva foco/estado)
      var sesiones = JSON.parse(texto); // si esto tira, cae al catch de abajo (mismo mensaje llano)
      ultimoJsonTexto = texto;
      seCargoAlgunaVez = true;
      render(sesiones);
    }).catch(function (err) {
      console.error('error cargando /api/sesiones', err);
      if (seCargoAlgunaVez) return; // ya hay una lista buena en pantalla: un error aislado no la borra
      cont.textContent = '';
      var p = document.createElement('p');
      p.className = 'estado-error';
      p.textContent = 'No pudimos cargar las salas. Reintentamos cada 5 s.';
      cont.appendChild(p);
    });
  }

  cargar();
  setInterval(cargar, 5000);
})();
</script>
</body>
</html>
